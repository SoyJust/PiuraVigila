spring.application.name=piuravigila
# Credenciales por variables de entorno: no se versionan contraseñas.
spring.datasource.url=${PIURA_DB_URL:jdbc:postgresql://localhost:5432/piuravigila}
spring.datasource.username=${PIURA_DB_USER}
spring.datasource.password=${PIURA_DB_PASSWORD:}
# Foto máx. 2 MB (RF-01). Margen mínimo para el resto del formulario; el Service vuelve a validar.
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=4MB
spring.thymeleaf.cache=false
# Reglas anti-spam y rutas (RF-06)
piuravigila.antispam.intervalo-seg=60
piuravigila.antispam.max-por-dia=3
piuravigila.foto.max-bytes=2097152
piuravigila.foto.directorio=${PIURA_FOTOS_DIR:fotos}
piuravigila.zona-horaria=America/Lima
piuravigila.dashboard.umbral-otra=10
# Contraseña inicial del usuario "admin" (solo si su hash sigue pendiente). Definir por variable de entorno.
piuravigila.admin.password-inicial=${PIURA_ADMIN_PASSWORD:}
logging.file.name=logs/piuravigila.log
logging.level.pe.edu.utp.piuravigila=INFO
