# Perfil de despliegue (Semana 15). Se activa con --spring.profiles.active=prod.
# Secretos y rutas llegan por variables de entorno; ninguno se versiona.
spring.thymeleaf.cache=true

# HTTPS en 8443 con el almacén de claves indicado por variables de entorno.
server.port=${PIURA_HTTPS_PUERTO:8443}
server.ssl.enabled=true
server.ssl.key-store=${PIURA_KEYSTORE}
server.ssl.key-store-password=${PIURA_KEYSTORE_PASSWORD}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=piuravigila
# El conector HTTP solo redirige a HTTPS (RedireccionHttps).
piuravigila.http.puerto=${PIURA_HTTP_PUERTO:8080}

# Cookie de sesión solo por HTTPS.
server.servlet.session.cookie.secure=true
