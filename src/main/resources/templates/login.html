<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" th:href="@{/css/piuravigila.css}"><title>Iniciar sesión</title></head><body><div th:replace="~{fragments :: cabecera('panel')}"></div>
<main><div class="card" style="max-width:26rem;margin-inline:auto"><h1>Panel municipal</h1>
<p class="error" th:if="${error}" th:text="${error}"></p>
<form method="post" th:action="@{/login}">
 <label for="usuario">Usuario</label><input id="usuario" name="usuario" required autocomplete="username" style="width:100%">
 <label for="clave">Contraseña</label><input id="clave" name="clave" type="password" required autocomplete="current-password" style="width:100%">
 <p><button type="submit">Iniciar sesión</button></p></form></div></main></body></html>
