<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" th:href="@{/css/piuravigila.css}"><title>Iniciar sesión · Panel municipal</title></head><body><div th:replace="~{fragments :: cabecera('panel')}"></div>
<main><div class="card acceso">
<svg class="icono-grande" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="2"/></svg>
<h1>Panel municipal</h1>
<p class="mut">Acceso exclusivo para el personal de la municipalidad. Si eres vecino, puedes <a th:href="@{/reportar}">registrar un reporte</a> sin cuenta.</p>
<p class="error" th:if="${error}" th:text="${error}" role="alert"></p>
<form method="post" th:action="@{/login}"><input type="hidden" name="_csrf" th:value="${csrf}">
 <label for="usuario">Usuario</label><input id="usuario" name="usuario" required autocomplete="username" class="ancho-total" autocapitalize="none" spellcheck="false">
 <label for="clave">Contraseña</label><input id="clave" name="clave" type="password" required autocomplete="current-password" class="ancho-total">
 <p class="acciones"><button type="submit" class="ancho-total">Iniciar sesión</button></p></form>
<small class="pista">¿Olvidaste tu contraseña? Pídele al administrador del sistema que te asigne una nueva.</small>
</div></main>
<footer th:replace="~{fragments :: pie}"></footer>
</body></html>
